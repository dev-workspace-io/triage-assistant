<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triage SQL Assistant</title>

  <!-- Google Fonts & Prism CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

  <style>
    :root {
      --primary-orange: #ff5500;
      --primary-hover: #e04b00;
      --cyan-glow: #00f0ff;
      --bg-color: #04070e;
      --card-bg: rgba(11, 16, 27, 0.9);
      --sidebar-bg: #0b0f19;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --border-color: #1f2937;
      --bot-msg-bg: #141c2f;
      --user-msg-bg: #ff5500;
      --code-bg: #060a12;
    }

    [data-theme="light"] {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --sidebar-bg: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --bot-msg-bg: #fff5f0;
      --user-msg-bg: #ff5500;
      --code-bg: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: background-color 0.2s, color 0.2s; }
    body { background-color: var(--bg-color); color: var(--text-primary); height: 100vh; display: flex; overflow: hidden; }

    /* ---------------------------------------------------- */
    /* FAST VERTICAL FLOATING TECHNICAL BACKGROUND         */
    /* ---------------------------------------------------- */
    .login-bg-graphics {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
      overflow: hidden;
      opacity: 0.75;
    }

    .cyber-grid {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(rgba(255, 85, 0, 0.12) 1.2px, transparent 1.2px);
      background-size: 35px 35px;
    }

    .data-column {
      position: absolute;
      width: 140px;
      display: flex; flex-direction: column; gap: 40px;
      align-items: center; justify-content: center;
    }

    .data-column.left { left: 8%; top: -10%; animation: floatUpDown_Long 6s ease-in-out infinite alternate; }
    .data-column.right { right: 8%; top: -10%; animation: floatUpDown_Long 6s ease-in-out infinite 1s alternate; }

    .tech-graphic {
      width: 120px; height: 120px;
      border: 1px dashed rgba(255, 85, 0, 0.3);
      border-radius: 12px;
      padding: 10px;
      background: rgba(11, 16, 27, 0.6);
      box-shadow: 0 0 15px rgba(255, 85, 0, 0.15);
      animation: graphicGlow 3s ease-in-out infinite alternate;
    }

    .tech-graphic svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 0 5px rgba(0, 240, 255, 0.4));
    }

    .bar-anim { transform-origin: bottom; animation: barGrow 0.8s ease-in-out infinite alternate; }
    .b1 { animation-delay: 0.1s; }
    .b2 { animation-delay: 0.3s; }
    .b3 { animation-delay: 0.5s; }

    .data-stream-line { stroke-dasharray: 6, 12; animation: streamFlow 1.2s linear infinite; }

    @keyframes floatUpDown_Long {
      0% { transform: translateY(0%); }
      100% { transform: translateY(40%); }
    }

    @keyframes graphicGlow {
      0% { border-color: rgba(255, 85, 0, 0.25); box-shadow: 0 0 15px rgba(255, 85, 0, 0.15); }
      100% { border-color: rgba(0, 240, 255, 0.7); box-shadow: 0 0 25px rgba(0, 240, 255, 0.4); }
    }

    @keyframes barGrow {
      0% { transform: scaleY(0.3); opacity: 0.3; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    @keyframes streamFlow {
      from { stroke-dashoffset: 36; }
      to { stroke-dashoffset: 0; }
    }

    /* ---------------------------------------------------- */
    /* LOGIN BOX & RESET PASSWORD                           */
    /* ---------------------------------------------------- */
    #loginOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(4, 7, 14, 0.9); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .login-box {
      background: var(--card-bg); padding: 40px 36px; border-radius: 16px;
      border: 1.5px solid var(--border-color); width: 100%; max-width: 380px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; z-index: 10;
    }
    .login-box h2 { margin-bottom: 22px; font-size: 20px; color: #ffffff; font-weight: 700; letter-spacing: 0.5px; }
    .login-box input {
      width: 100%; padding: 13px; margin-bottom: 14px; border-radius: 8px; border: 1px solid var(--border-color);
      background: #060a12; color: var(--text-primary); outline: none; font-size: 14px;
    }
    .login-box input:focus { border-color: var(--primary-orange); box-shadow: 0 0 8px rgba(255, 85, 0, 0.4); }
    .login-box button {
      width: 100%; padding: 13px; background: var(--primary-orange); color: white; border: none;
      border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 8px; font-size: 15px;
      box-shadow: 0 4px 15px rgba(255, 85, 0, 0.4);
    }
    .login-box button:hover { background: var(--primary-hover); }
    
    /* Reset Password Option */
    .reset-pwd-btn {
      background: none; border: none; color: var(--text-secondary);
      font-size: 12px; cursor: pointer; margin-top: 14px; text-decoration: underline;
      display: inline-block; box-shadow: none !important; width: auto !important; padding: 0 !important;
    }
    .reset-pwd-btn:hover { color: var(--primary-orange); background: none !important; }

    .login-error { font-size: 13px; color: #ef4444; margin-top: 10px; display: none; }

    /* Bottom Right Corner Branding */
    .login-corner-footer {
      position: absolute;
      bottom: 20px;
      right: 25px;
      font-size: 13px;
      color: var(--text-secondary);
      z-index: 10;
      opacity: 0.85;
      letter-spacing: 0.5px;
    }
    .login-corner-footer b { color: var(--primary-orange); }

    /* ---------------------------------------------------- */
    /* PERFECT CENTERED WELCOME OVERLAY & LOADER            */
    /* ---------------------------------------------------- */
    #welcomeOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-color);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #welcomeOverlay.show { opacity: 1; visibility: visible; }
    
    .welcome-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .loader-ring {
      width: 50px; height: 50px; border: 4px solid rgba(255, 85, 0, 0.15);
      border-top: 4px solid var(--primary-orange); border-radius: 50%;
      animation: spin 0.9s linear infinite; margin: 0 auto 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .welcome-card h1 { font-size: 28px; color: var(--text-primary); margin-top: 10px; text-align: center; }
    .welcome-card p { color: var(--primary-orange); font-size: 14px; margin-top: 6px; text-align: center; }

    /* MAIN APP CONTAINER */
    #appContainer { display: flex; width: 100%; height: 100vh; visibility: hidden; }
    .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
    .new-chat-btn { width: 100%; padding: 10px; background: var(--primary-orange); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .history-item { padding: 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-size: 13px; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center; }
    .history-item:hover, .history-item.active { background: var(--card-bg); border-color: var(--border-color); color: var(--text-primary); }
    .history-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .delete-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; display: none; }
    .history-item:hover .delete-btn { display: block; }

    .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .user-row { display: flex; justify-content: space-between; align-items: center; }
    .logout-btn { background: none; border: none; color: var(--primary-orange); cursor: pointer; font-size: 13px; font-weight: 600; text-align: left; }

    .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); }
    .top-bar { height: 60px; padding: 0 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--sidebar-bg); }
    .theme-toggle { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }

    .messages-container { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
    .msg.user { align-self: flex-end; background: var(--user-msg-bg); color: white; border-bottom-right-radius: 2px; }
    .msg.bot { align-self: flex-start; background: var(--bot-msg-bg); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }
    .msg-author { font-weight: 700; margin-bottom: 6px; font-size: 12px; opacity: 0.8; }

    .sql-box { margin-top: 12px; background: var(--code-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; }
    .sql-header { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 6px 12px; font-size: 11px; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); }
    .copy-btn { background: var(--primary-orange); color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }

    .input-area { padding: 16px 24px; border-top: 1px solid var(--border-color); background: var(--sidebar-bg); }
    .input-box { display: flex; gap: 12px; }
    .input-box textarea { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); padding: 12px; font-size: 14px; resize: none; height: 48px; outline: none; }
    .send-btn { background: var(--primary-orange); color: white; border: none; padding: 0 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .footer-note { font-size: 11px; color: var(--text-secondary); text-align: center; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- LOGIN OVERLAY WITH FAST VERTICAL TECHNICAL DATA FLOAT BACKGROUND -->
  <div id="loginOverlay">
    
    <div class="login-bg-graphics">
      <div class="cyber-grid"></div>

      <!-- LEFT SIDE DATA COLUMN -->
      <div class="data-column left">
        <div class="tech-graphic">
          <svg viewBox="0 0 100 100" fill="none">
            <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
              <ellipse cx="50" cy="20" rx="35" ry="10" fill="#04070e"/>
              <path d="M15 20 v20 c0 5.5 15.6 10 35 10 s35 -4.5 35 -10 v-20" fill="#04070e" />
              <path d="M15 40 v20 c0 5.5 15.6 10 35 10 s35 -4.5 35 -10 v-20" fill="#04070e" />
            </g>
            <path d="M50 40 L50 80" stroke="#00f0ff" stroke-width="2" class="data-stream-line" />
            <circle cx="50" cy="80" r="4" fill="#00f0ff"/>
          </svg>
        </div>

        <div class="tech-graphic">
          <svg viewBox="0 0 100 100" fill="none">
            <g fill="#ff5500">
              <rect class="bar-anim b1" x="15" y="10" width="16" height="80" rx="3" />
              <rect class="bar-anim b2" x="42" y="25" width="16" height="65" rx="3" />
              <rect class="bar-anim b3" x="69" y="5"  width="16" height="85" rx="3" />
            </g>
            <line x1="10" y1="92" x2="90" y2="92" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>
          </svg>
        </div>

        <div class="tech-graphic">
          <svg viewBox="0 0 120 100" fill="none">
            <path d="M20 70 L50 20 L90 80 L110 50" stroke="#ff5500" stroke-width="3"/>
            <path d="M20 70 L90 80" stroke="#00f0ff" stroke-width="1.5" class="data-stream-line" opacity="0.6"/>
            <circle cx="20" cy="70" r="4" fill="#ff5500"/>
            <circle cx="50" cy="20" r="4" fill="#00f0ff"/>
            <circle cx="90" cy="80" r="4" fill="#ff5500"/>
          </svg>
        </div>
      </div>

      <!-- RIGHT SIDE DATA COLUMN -->
      <div class="data-column right">
        <div class="tech-graphic">
          <svg viewBox="0 0 100 100" fill="none">
            <path d="M50 50 L50 10 A40 40 0 0 1 85 50 Z" fill="#ff5500" opacity="0.9" />
            <path d="M50 50 L85 50 A40 40 0 0 1 50 85 Z" fill="#ff5500" opacity="0.6" />
            <path d="M50 50 L50 85 A40 40 0 1 1 50 10 Z" fill="#ff5500" opacity="0.3" />
            <line x1="50" y1="50" x2="80" y2="20" stroke="#00f0ff" stroke-width="3"/>
            <circle cx="80" cy="20" r="4" fill="#00f0ff"/>
          </svg>
        </div>

        <div class="tech-graphic">
          <svg viewBox="0 0 100 100" fill="none">
            <ellipse cx="50" cy="25" rx="35" ry="10" stroke="#ffffff" stroke-width="2.5" fill="#04070e"/>
            <path d="M15 25 v25 c0 5.5 15.6 10 35 10 s35 -4.5 35 -10 v-25" stroke="#ffffff" stroke-width="2.5" fill="#04070e" />
            <text x="50" y="85" fill="#ffffff" font-size="22" font-family="'Fira Code', monospace" font-weight="700" text-anchor="middle">DB_SQL</text>
            <circle cx="50" cy="40" r="3" fill="#ff5500"/>
          </svg>
        </div>

        <div class="tech-graphic">
          <svg viewBox="0 0 200 100" fill="none">
            <path d="M10 80 Q 50 10, 100 50 T 190 20" stroke="#ff5500" stroke-width="4" fill="none"/>
            <path d="M10 80 L190 80" stroke="#00f0ff" stroke-width="1.5" class="data-stream-line" opacity="0.6"/>
            <circle cx="100" cy="50" r="5" fill="#00f0ff"/>
            <text x="10" y="96" fill="#9ca3af" font-size="10" font-family="monospace">TREND_01</text>
          </svg>
        </div>
      </div>
    </div>

    <!-- LOGIN FORM BOX WITH RESET PASSWORD -->
    <div class="login-box">
      <h2>Triage SQL Workspace</h2>
      <input type="email" id="loginEmail" placeholder="email@oxiliry.com">
      <input type="password" id="loginPass" placeholder="Password">
      <button id="loginBtn" onclick="attemptLogin()">Login</button>
      <br>
      <button type="button" class="reset-pwd-btn" onclick="resetPassword()">Forgot or Reset Password?</button>
      <div id="loginError" class="login-error"></div>
    </div>

    <!-- BOTTOM RIGHT CORNER BRANDING -->
    <div class="login-corner-footer">
      Powered by <b>ReBiz @Triage AI</b>
    </div>
  </div>

  <!-- WELCOME SCREEN OVERLAY (PERFECTLY CENTERED) -->
  <div id="welcomeOverlay">
    <div class="welcome-card">
      <div class="loader-ring"></div>
      <h1 id="welcomeText">Welcome!</h1>
      <p>Initializing SQL Assistant Workspace...</p>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appContainer">
    <div class="sidebar">
      <div>
        <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="sidebar-footer">
        <div class="user-row">
          <span class="user-info" id="userNameDisplay">User</span>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="main-chat">
      <div class="top-bar">
        <div>
          <h3>Triage SQL Assistant</h3>
          <p>Smart Query Workspace</p>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark / ☀️ Light</button>
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <div class="input-area">
        <div class="input-box">
          <textarea id="userInput" placeholder="Write here something..." onkeydown="handleKeyPress(event)"></textarea>
          <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
        <p class="footer-note">Powered by <b>ReBiz @Triage AI</b> | 💡 <i>Triage AI can make mistakes. Double-check important info & conditions before executing.</i></p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSufITdeq53VYP2u4cH5FLMBZHxPOa5YvWUoZEzHSS5A1N1WXi6m_IzkipVcWCZLjQ/exec";

    let currentUser = null;
    let chats = [];
    let currentChatId = null;

    async function apiCall(payload, retries = 2) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        return await response.json();
      } catch (err) {
        clearTimeout(timeoutId);
        if (retries > 0) {
          await new Promise(r => setTimeout(r, 1000));
          return await apiCall(payload, retries - 1);
        }
        throw err;
      }
    }

    async function attemptLogin() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPass").value;
      const errorDiv = document.getElementById("loginError");
      const btn = document.getElementById("loginBtn");

      errorDiv.style.display = "none";
      if (!email || !password) {
        errorDiv.innerText = "Please fill in all fields.";
        errorDiv.style.display = "block";
        return;
      }

      btn.innerText = "Logging in...";
      btn.disabled = true;

      try {
        const res = await apiCall({ action: "login", email: email, password: password });

        if (res.status === "success") {
          currentUser = res.user;

          document.getElementById("loginOverlay").style.display = "none";

          const welcomeOverlay = document.getElementById("welcomeOverlay");
          document.getElementById("welcomeText").innerText = "Welcome, " + currentUser.name + "!";
          welcomeOverlay.classList.add("show");

          setTimeout(() => {
            welcomeOverlay.classList.remove("show");
            document.getElementById("appContainer").style.visibility = "visible";
            document.getElementById("userNameDisplay").innerText = currentUser.name;
            loadChatHistory();
          }, 2000);

        } else {
          errorDiv.innerText = res.message || "Invalid login credentials.";
          errorDiv.style.display = "block";
        }
      } catch (err) {
        errorDiv.innerText = "Connection error. Please check your network.";
        errorDiv.style.display = "block";
      } finally {
        btn.innerText = "Login";
        btn.disabled = false;
      }
    }

    async function resetPassword() {
      const email = document.getElementById("loginEmail").value;
      const errorDiv = document.getElementById("loginError");
      errorDiv.style.display = "none";

      if (!email) {
        errorDiv.innerText = "Please enter your email to reset password.";
        errorDiv.style.display = "block";
        return;
      }

      alert("Password reset instructions have been sent if the email is registered.");
    }

    function logout() {
      currentUser = null;
      document.getElementById("appContainer").style.visibility = "hidden";
      document.getElementById("loginOverlay").style.display = "flex";
      document.getElementById("loginEmail").value = "";
      document.getElementById("loginPass").value = "";
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const newTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", newTheme);
    }

    async function loadChatHistory() {
      try {
        const res = await apiCall({ action: "getHistory", email: currentUser.email });
        chats = res.history || [];

        renderHistoryList();
        if (chats.length > 0) {
          selectChat(chats[0].chatId);
        } else {
          startNewChat();
        }
      } catch (e) {
        startNewChat();
      }
    }

    function renderHistoryList() {
      const list = document.getElementById("historyList");
      list.innerHTML = "";
      chats.forEach(c => {
        const item = document.createElement("div");
        item.className = `history-item ${c.chatId === currentChatId ? 'active' : ''}`;
        
        item.innerHTML = `
          <span class="history-title" onclick="selectChat('${c.chatId}')">${c.title || 'New Chat'}</span>
          <button class="delete-btn" onclick="deleteChat(event, '${c.chatId}')" title="Delete Chat">🗑️</button>
        `;
        list.appendChild(item);
      });
    }

    function selectChat(id) {
      currentChatId = id;
      renderHistoryList();
      const chat = chats.find(c => c.chatId === id);
      const container = document.getElementById("messagesContainer");
      container.innerHTML = "";

      if (chat && chat.messages) {
        chat.messages.forEach(m => renderMessageUI(m.role, m.text, m.sql));
      }
    }

    function startNewChat() {
      currentChatId = "chat_" + Date.now();
      const newChat = { chatId: currentChatId, title: "New Chat", messages: [] };
      chats.unshift(newChat);
      selectChat(currentChatId);
    }

    async function deleteChat(event, chatId) {
      event.stopPropagation();
      if (!confirm("Are you sure you want to delete this chat?")) return;

      chats = chats.filter(c => c.chatId !== chatId);

      if (chats.length > 0) {
        selectChat(chats[0].chatId);
      } else {
        startNewChat();
      }

      try {
        await apiCall({ action: "deleteChat", email: currentUser.email, chatId: chatId });
      } catch(e) {}
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const sendBtn = document.querySelector(".send-btn");
      const msgText = input.value.trim();
      if (!msgText) return;

      input.value = "";
      sendBtn.disabled = true;

      renderMessageUI("user", msgText);
      saveToLocalHistory("user", msgText);

      const container = document.getElementById("messagesContainer");
      const loadingDiv = document.createElement("div");
      loadingDiv.className = "msg bot temp-loading";
      loadingDiv.innerText = "Thinking...";
      container.appendChild(loadingDiv);
      container.scrollTop = container.scrollHeight;

      try {
        const res = await apiCall({
          action: "processMessage",
          message: msgText,
          userName: currentUser ? currentUser.name : "User"
        });

        document.querySelectorAll(".temp-loading").forEach(el => el.remove());

        if (res && res.text) {
          renderMessageUI("bot", res.text, res.sql);
          saveToLocalHistory("bot", res.text, res.sql);

          const currentChat = chats.find(c => c.chatId === currentChatId);
          if (currentChat && currentChat.title === "New Chat") {
            currentChat.title = msgText.substring(0, 20) + "...";
            renderHistoryList();
          }
          saveChatToBackend(currentChat);
        } else {
          renderMessageUI("bot", "No response received from server.");
        }

      } catch (err) {
        document.querySelectorAll(".temp-loading").forEach(el => el.remove());
        renderMessageUI("bot", "Connection error. Please try again.");
      } finally {
        sendBtn.disabled = false;
      }
    }

    function saveToLocalHistory(role, text, sql = null) {
      let chat = chats.find(c => c.chatId === currentChatId);
      if (!chat) {
        chat = { chatId: currentChatId, title: text.substring(0, 20) + "...", messages: [] };
        chats.unshift(chat);
      }
      chat.messages.push({ role, text, sql });
    }

    async function saveChatToBackend(chat) {
      if (!chat) return;
      try {
        await apiCall({
          action: "saveChat",
          email: currentUser.email,
          chatId: chat.chatId,
          title: chat.title,
          messages: chat.messages
        });
      } catch(e) {}
    }

    function renderMessageUI(role, text, sql) {
      const container = document.getElementById("messagesContainer");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${role}`;

      let html = `<div class="msg-author">${role === 'user' ? 'You:' : 'Assistant:'}</div>`;
      html += `<div>${text.replace(/\n/g, '<br>')}</div>`;

      if (sql) {
        html += `
          <div class="sql-box">
            <div class="sql-header">
              <span>SQL QUERY</span>
              <button class="copy-btn" onclick="copySql(this)">Copy</button>
            </div>
            <pre><code class="language-sql">${escapeHtml(sql)}</code></pre>
          </div>
        `;
      }

      msgDiv.innerHTML = html;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
      Prism.highlightAll();
    }

    function copySql(btn) {
      const code = btn.closest('.sql-box').querySelector('code').innerText;
      navigator.clipboard.writeText(code);
      btn.innerText = "Copied!";
      setTimeout(() => btn.innerText = "Copy", 2000);
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }
  </script>
</body>
</html>
