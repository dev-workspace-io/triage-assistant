<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triage SQL Assistant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

  <style>
    :root {
      --primary-orange: #ff5500;
      --primary-hover: #e04b00;
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --sidebar-bg: #0d121f;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --border-color: #1f2937;
      --bot-msg-bg: #1a233a;
      --user-msg-bg: #ff5500;
      --code-bg: #050811;
    }

    [data-theme="light"] {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --sidebar-bg: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --bot-msg-bg: #fff5f0;
      --user-msg-bg: #ff5500;
      --code-bg: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: background-color 0.2s, color 0.2s; }
    body { background-color: var(--bg-color); color: var(--text-primary); height: 100vh; display: flex; overflow: hidden; }

    /* BACKGROUND GRAPHICS */
    .login-bg-graphics {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; opacity: 0.3; z-index: 1; overflow: hidden;
    }
    .anim-pos-1 { position: absolute; top: 6%; left: 6%; width: 220px; height: 220px; animation: floatAnim 6s ease-in-out infinite alternate; }
    .anim-pos-2 { position: absolute; top: 8%; right: 8%; width: 240px; height: 180px; }
    .anim-pos-3 { position: absolute; bottom: 8%; left: 7%; width: 260px; height: 160px; }
    .anim-pos-4 { position: absolute; bottom: 8%; right: 8%; width: 200px; height: 200px; animation: rotatePie 20s linear infinite; }

    @keyframes floatAnim { 0% { transform: translateY(-8px); } 100% { transform: translateY(12px); } }
    @keyframes rotatePie { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .bar-anim { transform-origin: bottom; animation: barGrow 2s ease-in-out infinite alternate; }
    .b1 { animation-delay: 0.1s; } .b2 { animation-delay: 0.4s; } .b3 { animation-delay: 0.7s; }
    @keyframes barGrow { 0% { transform: scaleY(0.3); } 100% { transform: scaleY(1); } }

    .data-grid-dots {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(rgba(255, 85, 0, 0.18) 1.5px, transparent 1.5px);
      background-size: 36px 36px;
    }

    /* LOGIN & MODAL */
    #loginOverlay, .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 15, 25, 0.94); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .login-box, .modal-box {
      background: var(--card-bg); padding: 32px; border-radius: 16px; border: 1px solid var(--border-color);
      width: 100%; max-width: 380px; text-align: center; position: relative; z-index: 2;
    }
    .login-box h2, .modal-box h3 { margin-bottom: 20px; font-size: 20px; }
    .login-box input, .modal-box input {
      width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-primary); outline: none;
    }
    .login-box button, .modal-box button.btn-primary {
      width: 100%; padding: 12px; background: var(--primary-orange); color: white; border: none;
      border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .reset-pwd-btn {
      background: none; border: none; color: var(--text-secondary);
      font-size: 12px; cursor: pointer; margin-top: 14px; text-decoration: underline;
    }
    .reset-pwd-btn:hover { color: var(--primary-orange); }
    .login-error, .modal-msg { font-size: 13px; margin-top: 10px; display: none; }
    .modal-close { position: absolute; top: 12px; right: 16px; background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; }

    /* LOADING SPINNER OVERLAY (FIX FOR TIMEOUT) */
    #welcomeOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-color); display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 10000; display: none;
    }
    .loader-ring {
      width: 50px; height: 50px; border: 4px solid rgba(255, 85, 0, 0.15);
      border-top: 4px solid var(--primary-orange); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* MAIN APP LAYOUT */
    #appContainer { display: flex; width: 100%; height: 100vh; visibility: hidden; }
    .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
    .new-chat-btn { width: 100%; padding: 10px; background: var(--primary-orange); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .history-item { padding: 10px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center; }
    .history-item:hover, .history-item.active { background: var(--card-bg); color: var(--text-primary); }
    .history-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .delete-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; display: none; }
    .history-item:hover .delete-btn { display: block; }

    .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .user-row { display: flex; justify-content: space-between; align-items: center; }
    .user-info { font-weight: 600; font-size: 13px; }
    .icon-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 15px; }
    .logout-btn { background: none; border: none; color: var(--primary-orange); cursor: pointer; font-size: 13px; font-weight: 600; text-align: left; }

    .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); }
    .top-bar { height: 60px; padding: 0 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--sidebar-bg); }
    .theme-toggle { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
    .messages-container { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
    .msg.user { align-self: flex-end; background: var(--user-msg-bg); color: white; }
    .msg.bot { align-self: flex-start; background: var(--bot-msg-bg); border: 1px solid var(--border-color); }
    .msg-author { font-weight: 700; margin-bottom: 4px; font-size: 11px; opacity: 0.8; }

    .sql-box { margin-top: 10px; background: var(--code-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; }
    .sql-header { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 6px 12px; font-size: 11px; }
    .copy-btn { background: var(--primary-orange); color: white; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    pre[class*="language-"] { margin: 0 !important; padding: 12px !important; }

    .input-area { padding: 16px 24px; border-top: 1px solid var(--border-color); background: var(--sidebar-bg); }
    .input-box { display: flex; gap: 12px; }
    .input-box textarea { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); padding: 12px; font-size: 14px; resize: none; height: 48px; outline: none; }
    .send-btn { background: var(--primary-orange); color: white; border: none; padding: 0 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .footer-note { font-size: 11px; color: var(--text-secondary); text-align: center; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginOverlay">
    <div class="login-bg-graphics">
      <div class="data-grid-dots"></div>
      <svg class="anim-pos-1" viewBox="0 0 100 100" fill="none"><g stroke="#ff5500" stroke-width="2"><ellipse cx="50" cy="20" rx="35" ry="10" fill="#111827"/><path d="M15 20 v20 c0 5.5 15.6 10 35 10 s35 -4.5 35 -10 v-20" fill="#111827"/><path d="M15 40 v20 c0 5.5 15.6 10 35 10 s35 -4.5 35 -10 v-20" fill="#111827"/></g></svg>
      <svg class="anim-pos-2" viewBox="0 0 160 100" fill="none"><g fill="#ff5500"><rect class="bar-anim b1" x="10" y="20" width="16" height="70" rx="3" /><rect class="bar-anim b2" x="38" y="10" width="16" height="80" rx="3" /><rect class="bar-anim b3" x="66" y="40" width="16" height="50" rx="3" /></g></svg>
    </div>

    <div class="login-box">
      <h2>Triage SQL Workspace</h2>
      <input type="email" id="loginEmail" placeholder="email@oxiliry.com">
      <input type="password" id="loginPass" placeholder="Password">
      <button id="loginBtn" onclick="attemptLogin()">Login</button>
      <br>
      <button type="button" class="reset-pwd-btn" onclick="resetPassword()">Forgot or Reset Password?</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <!-- INITIALIZATION OVERLAY (3-SECOND PAUSE PREVENTS TIMEOUT ERROR) -->
  <div id="welcomeOverlay">
    <div class="loader-ring"></div>
    <h2 id="welcomeText" style="color: var(--text-primary);">Logging in...</h2>
    <p style="color: var(--primary-orange); font-size: 14px; margin-top: 6px;">Initializing Secure Connection...</p>
  </div>

  <!-- CHANGE PASSWORD MODAL -->
  <div id="passwordModal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <button class="modal-close" onclick="closePasswordModal()">✕</button>
      <h3>Change Password</h3>
      <input type="password" id="oldPassInput" placeholder="Current Password">
      <input type="password" id="newPassInput" placeholder="New Password">
      <input type="password" id="confirmPassInput" placeholder="Confirm New Password">
      <button id="changePassBtn" class="btn-primary" onclick="submitPasswordChange()">Update Password</button>
      <div id="passModalMsg" class="modal-msg"></div>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appContainer">
    <div class="sidebar">
      <div>
        <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
        <div class="history-list" id="historyList"></div>
      </div>
      <div class="sidebar-footer">
        <div class="user-row">
          <span class="user-info" id="userNameDisplay">User</span>
          <!-- GEAR SIGN FOR CHANGE PASSWORD -->
          <button class="icon-btn" onclick="openPasswordModal()" title="Change Password">⚙️</button>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="main-chat">
      <div class="top-bar">
        <div>
          <h3>Triage SQL Assistant</h3>
          <p>Smart Query Workspace</p>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark / ☀️ Light</button>
      </div>
      <div class="messages-container" id="messagesContainer"></div>
      <div class="input-area">
        <div class="input-box">
          <textarea id="userInput" placeholder="Write here something..." onkeydown="handleKeyPress(event)"></textarea>
          <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
        <p class="footer-note">Powered by <b>ReBiz @Triage AI</b> | 💡 <i>Triage AI can make mistakes. Double-check important info & conditions before executing.</i></p>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>

  <script>
    // URL TO YOUR GOOGLE APPS SCRIPT WEB APP
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCshH_Sg26-yZAnw-Hq3N8E8r1_rP-R0vB8N_9Z08v6m_f6v6m_f6v6m_f6v6m_f6v/exec"; 

    let currentUser = null;
    let chats = [];
    let currentChatId = null;

    async function apiCall(payload) {
      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        if (!response.ok) throw new Error("HTTP error " + response.status);
        return await response.json();
      } catch (error) {
        console.error("API Error:", error);
        return { status: "error", message: "Connection error. Please try again." };
      }
    }

    async function attemptLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPass").value.trim();
      const errorDiv = document.getElementById("loginError");
      const btn = document.getElementById("loginBtn");

      errorDiv.style.display = "none";
      if (!email || !password) {
        errorDiv.innerText = "Please enter both Email and Password.";
        errorDiv.style.display = "block";
        return;
      }

      btn.innerText = "Authenticating...";
      btn.disabled = true;

      const res = await apiCall({ action: "login", email: email, password: password });

      if (res.status === "success") {
        currentUser = res.user;
        
        // Hide Login & Show Loader Overlay
        document.getElementById("loginOverlay").style.display = "none";
        const welcomeOverlay = document.getElementById("welcomeOverlay");
        document.getElementById("welcomeText").innerText = "Welcome, " + currentUser.name;
        welcomeOverlay.style.display = "flex";

        // 3-SECOND SAFETY PAUSE (Ensures backend socket connection is fresh)
        setTimeout(async () => {
          document.getElementById("userNameDisplay").innerText = currentUser.name;
          document.getElementById("appContainer").style.visibility = "visible";
          welcomeOverlay.style.display = "none";
          await loadChatHistory();
        }, 3000);

      } else {
        errorDiv.innerText = res.message;
        errorDiv.style.display = "block";
        btn.innerText = "Login";
        btn.disabled = false;
      }
    }

    async function resetPassword() {
      const email = document.getElementById("loginEmail").value.trim();
      const errorDiv = document.getElementById("loginError");
      errorDiv.style.display = "none";

      if (!email) {
        errorDiv.innerText = "Please type your email address above first.";
        errorDiv.style.display = "block";
        return;
      }

      const btn = document.querySelector(".reset-pwd-btn");
      btn.innerText = "Sending Email...";
      btn.disabled = true;

      const res = await apiCall({ action: "resetPassword", email: email });

      if (res.status === "success") {
        alert(res.message);
        errorDiv.innerText = "";
      } else {
        errorDiv.innerText = res.message;
        errorDiv.style.display = "block";
      }

      btn.innerText = "Forgot or Reset Password?";
      btn.disabled = false;
    }

    function logout() {
      currentUser = null;
      document.getElementById("appContainer").style.visibility = "hidden";
      document.getElementById("loginOverlay").style.display = "flex";
      document.getElementById("loginBtn").innerText = "Login";
      document.getElementById("loginBtn").disabled = false;
    }

    function openPasswordModal() {
      document.getElementById("oldPassInput").value = "";
      document.getElementById("newPassInput").value = "";
      document.getElementById("confirmPassInput").value = "";
      document.getElementById("passModalMsg").style.display = "none";
      document.getElementById("passwordModal").style.display = "flex";
    }

    function closePasswordModal() {
      document.getElementById("passwordModal").style.display = "none";
    }

    async function submitPasswordChange() {
      const oldPass = document.getElementById("oldPassInput").value;
      const newPass = document.getElementById("newPassInput").value;
      const confirmPass = document.getElementById("confirmPassInput").value;
      const msgDiv = document.getElementById("passModalMsg");

      msgDiv.style.display = "none";

      if (!oldPass || !newPass || !confirmPass) {
        msgDiv.innerText = "All fields required.";
        msgDiv.style.color = "#ef4444";
        msgDiv.style.display = "block";
        return;
      }

      if (newPass !== confirmPass) {
        msgDiv.innerText = "New passwords do not match.";
        msgDiv.style.color = "#ef4444";
        msgDiv.style.display = "block";
        return;
      }

      const res = await apiCall({
        action: "changePassword",
        email: currentUser.email,
        oldPassword: oldPass,
        newPassword: newPass
      });

      if (res.status === "success") {
        msgDiv.innerText = res.message;
        msgDiv.style.color = "#10b981";
        msgDiv.style.display = "block";
        setTimeout(closePasswordModal, 1500);
      } else {
        msgDiv.innerText = res.message;
        msgDiv.style.color = "#ef4444";
        msgDiv.style.display = "block";
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute("data-theme");
      document.documentElement.setAttribute("data-theme", current === "dark" ? "light" : "dark");
    }

    async function loadChatHistory() {
      const res = await apiCall({ action: "getHistory", email: currentUser.email });
      if (res.status === "success" && res.history.length > 0) {
        chats = res.history;
        renderHistoryList();
        selectChat(chats[0].chatId);
      } else {
        startNewChat();
      }
    }

    function renderHistoryList() {
      const list = document.getElementById("historyList");
      list.innerHTML = "";
      chats.forEach(c => {
        const item = document.createElement("div");
        item.className = `history-item ${c.chatId === currentChatId ? 'active' : ''}`;
        
        const titleSpan = document.createElement("span");
        titleSpan.className = "history-title";
        titleSpan.innerText = c.title || 'New Chat';
        titleSpan.onclick = () => selectChat(c.chatId);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.innerText = "🗑️";
        deleteBtn.onclick = (e) => { e.stopPropagation(); deleteChat(c.chatId); };

        item.appendChild(titleSpan);
        item.appendChild(deleteBtn);
        list.appendChild(item);
      });
    }

    function selectChat(id) {
      currentChatId = id;
      renderHistoryList();
      const chat = chats.find(c => c.chatId === id);
      const container = document.getElementById("messagesContainer");
      container.innerHTML = "";
      if (chat && chat.messages) {
        chat.messages.forEach(m => renderMessageUI(m.role, m.text, m.sql));
      }
    }

    function startNewChat() {
      currentChatId = "chat_" + Date.now();
      document.getElementById("messagesContainer").innerHTML = "";
      renderMessageUI("bot", `Hello ${currentUser.name}! How can I assist you with SQL today?`, null);
    }

    async function deleteChat(chatId) {
      if (!confirm("Are you sure you want to delete this chat?")) return;
      const res = await apiCall({ action: "deleteChat", email: currentUser.email, chatId: chatId });
      if (res.status === "success") {
        chats = chats.filter(c => c.chatId !== chatId);
        renderHistoryList();
        if (chats.length > 0) selectChat(chats[0].chatId);
        else startNewChat();
      }
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const msgText = input.value.trim();
      if (!msgText) return;

      input.value = "";
      renderMessageUI("user", msgText);

      const res = await apiCall({ action: "processMessage", message: msgText, userName: currentUser.name });
      renderMessageUI("bot", res.text, res.sql);

      let currentChat = chats.find(c => c.chatId === currentChatId);
      if (!currentChat) {
        currentChat = { chatId: currentChatId, title: msgText.substring(0, 20) + '...', messages: [] };
        chats.unshift(currentChat);
      }

      currentChat.messages.push({ role: "user", text: msgText });
      currentChat.messages.push({ role: "bot", text: res.text, sql: res.sql });

      renderHistoryList();

      apiCall({
        action: "saveChat",
        email: currentUser.email,
        chatId: currentChatId,
        title: currentChat.title,
        messages: currentChat.messages
      });
    }

    function renderMessageUI(role, text, sql) {
      const container = document.getElementById("messagesContainer");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${role}`;

      let html = `<div class="msg-author">${role === 'user' ? 'You' : 'Assistant'}</div><div>${text}</div>`;

      if (sql) {
        const escapedSql = sql.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        html += `
          <div class="sql-box">
            <div class="sql-header">
              <span>SQL QUERY</span>
              <button class="copy-btn" onclick="copySql(this)">Copy</button>
            </div>
            <pre><code class="language-sql">${escapedSql}</code></pre>
          </div>
        `;
      }

      msgDiv.innerHTML = html;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
      if (sql) Prism.highlightAll();
    }

    function copySql(btn) {
      const code = btn.closest('.sql-box').querySelector('code').innerText;
      navigator.clipboard.writeText(code);
      btn.innerText = "Copied!";
      setTimeout(() => btn.innerText = "Copy", 2000);
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }
  </script>
</body>
</html>
