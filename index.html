<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triage SQL Workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-orange: #ff5500;
      --bg-color: #0b0f17;
      --card-bg: #151c28;
      --sidebar-bg: #0d121d;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border-color: #243042;
      --chat-bg: #0b0f17;
      --bot-msg-bg: #221a16;
      --user-msg-bg: #ff5500;
      --code-bg: #050811;
    }

    [data-theme="light"] {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --sidebar-bg: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --chat-bg: #ffffff;
      --bot-msg-bg: #fff5f0;
      --user-msg-bg: #ff5500;
      --code-bg: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: background-color 0.2s, color 0.2s; }
    body { background-color: var(--bg-color); color: var(--text-primary); height: 100vh; display: flex; overflow: hidden; }

    /* LOGIN SCREEN */
    #loginOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-color); display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .login-box {
      background: var(--card-bg); padding: 32px; border-radius: 16px; border: 1px solid var(--border-color);
      width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .login-box h2 { margin-bottom: 20px; font-size: 20px; color: var(--text-primary); }
    .login-box input {
      width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--border-color);
      background: var(--bg-color); color: var(--text-primary); outline: none;
    }
    .login-box button {
      width: 100%; padding: 12px; background: var(--primary-orange); color: white; border: none;
      border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 8px;
    }

    /* MAIN LAYOUT */
    .app-container { display: flex; width: 100%; height: 100vh; }
    
    .sidebar {
      width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; padding: 16px; gap: 16px;
    }
    .new-chat-btn {
      background: var(--primary-orange); color: white; padding: 12px; border-radius: 8px; border: none;
      font-weight: 600; cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .history-item {
      padding: 10px 12px; border-radius: 8px; border: 1px solid transparent; cursor: pointer;
      font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .history-item:hover { background: var(--card-bg); border-color: var(--border-color); color: var(--text-primary); }
    
    .user-profile {
      padding-top: 12px; border-top: 1px solid var(--border-color); display: flex;
      justify-content: space-between; align-items: center; font-size: 13px;
    }
    .logout-btn { color: #ef4444; cursor: pointer; font-weight: 600; }

    .chat-container { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .header {
      padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex;
      justify-content: space-between; align-items: center; background: var(--card-bg);
    }
    .theme-toggle { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 12px; }

    .chat-box { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: var(--chat-bg); }
    .msg { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
    .user-msg { background: var(--user-msg-bg); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot-msg { background: var(--bot-msg-bg); color: var(--text-primary); align-self: flex-start; border-left: 4px solid var(--primary-orange); border-bottom-left-radius: 2px; }
    
    pre { background: var(--code-bg); color: #38bdf8; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 13px; margin-top: 8px; overflow-x: auto; }

    .input-area { padding: 16px 24px; border-top: 1px solid var(--border-color); background: var(--card-bg); }
    .input-box { display: flex; gap: 12px; }
    textarea { flex: 1; height: 48px; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-primary); outline: none; resize: none; }
    .send-btn { background: var(--primary-orange); color: white; border: none; padding: 0 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    
    .footer { text-align: center; font-size: 11px; color: var(--text-secondary); margin-top: 8px; }
  </style>
</head>
<body>

  <!-- LOGIN OVERLAY -->
  <div id="loginOverlay">
    <div class="login-box">
      <h2>Triage Assistant Login</h2>
      <p style="font-size:12px; color:var(--text-secondary); margin-bottom:12px;">Enter your @oxiliry.com credentials</p>
      <input type="email" id="loginEmail" placeholder="Email address">
      <input type="password" id="loginPass" placeholder="Password">
      <button onclick="doLogin()">Login</button>
      <p id="loginError" style="color:#ef4444; font-size:12px; margin-top:10px;"></p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div class="app-container">
    <div class="sidebar">
      <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
      <div class="history-list" id="historyList"></div>
      <div class="user-profile">
        <span id="userNameDisplay">User</span>
        <span class="logout-btn" onclick="logout()">Logout</span>
      </div>
    </div>

    <div class="chat-container">
      <div class="header">
        <div>
          <h3>Triage SQL Assistant</h3>
          <span style="font-size:12px; color:var(--text-secondary)">Smart Query Workspace</span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 Dark / ☀️ Light</button>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="input-area">
        <div class="input-box">
          <textarea id="userInput" placeholder="Write here something..." onkeydown="handleKey(event)"></textarea>
          <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
        <div class="footer">
          Powered by <strong>ReBiz Triage AI</strong> | <i>💡 Double-check important info before executing.</i>
        </div>
      </div>
    </div>
  </div>

  <script>
    // NEW DEPLOYED URL ADDED
    const API_URL = "https://script.google.com/macros/s/AKfycbzSufITdeq53VYP2u4cH5FLMBZHxPOa5YvWUoZEzHSS5A1N1WXi6m_IzkipVcWCZLjQ/exec";

    let currentUser = null;
    let currentChatId = null;
    let chatMessages = [];

    function initTheme() {
      let saved = localStorage.getItem("theme");
      if (!saved) {
        let hour = new Date().getHours();
        saved = (hour >= 6 && hour < 18) ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", saved);
    }
    initTheme();

    function toggleTheme() {
      let curr = document.documentElement.getAttribute("data-theme");
      let next = curr === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    }

    async function apiCall(payload) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    async function doLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPass").value.trim();
      document.getElementById("loginError").innerText = "Authenticating...";
      
      try {
        const res = await apiCall({ action: "login", email, password });

        if (res.status === "success") {
          currentUser = res.user;
          document.getElementById("userNameDisplay").innerText = currentUser.name;
          document.getElementById("loginOverlay").style.display = "none";
          loadHistory();
          startNewChat();
        } else {
          document.getElementById("loginError").innerText = res.message || "Login failed";
        }
      } catch(e) {
        console.error(e);
        document.getElementById("loginError").innerText = "Connection error. Please try again.";
      }
    }

    function logout() { location.reload(); }

    function startNewChat() {
      currentChatId = "chat_" + Date.now();
      chatMessages = [];
      document.getElementById("chatBox").innerHTML = "";
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text) return;

      appendMsg(text, "user");
      chatMessages.push({ sender: "user", text: text });
      input.value = "";

      try {
        const res = await apiCall({ action: "processMessage", message: text, userName: currentUser.name });
        appendMsg(res.text, "bot", res.sql);
        chatMessages.push({ sender: "bot", text: res.text, sql: res.sql });

        const title = chatMessages[0].text.substring(0, 25) + "...";
        apiCall({ action: "saveChat", email: currentUser.email, chatId: currentChatId, title: title, messages: chatMessages });
        loadHistory();
      } catch(e) {
        appendMsg("Error processing query. Try again.", "bot");
      }
    }

    function appendMsg(text, type, sql = "") {
      const box = document.getElementById("chatBox");
      let html = `<div class="msg ${type}-msg"><b>${type === 'user' ? 'You' : 'Assistant'}:</b><br>${text.replace(/\n/g, '<br>')}`;
      if (sql) { html += `<pre><code>${escapeHtml(sql)}</code></pre>`; }
      html += `</div>`;
      box.innerHTML += html;
      box.scrollTop = box.scrollHeight;
    }

    async function loadHistory() {
      try {
        const res = await apiCall({ action: "getHistory", email: currentUser.email });
        const list = document.getElementById("historyList");
        list.innerHTML = "";
        if (res.history) {
          res.history.reverse().forEach(h => {
            const item = document.createElement("div");
            item.className = "history-item";
            item.innerText = h.title;
            item.onclick = () => loadChatSession(h);
            list.appendChild(item);
          });
        }
      } catch(e) {
        console.error("History load error", e);
      }
    }

    function loadChatSession(session) {
      currentChatId = session.chatId;
      chatMessages = session.messages;
      const box = document.getElementById("chatBox");
      box.innerHTML = "";
      chatMessages.forEach(m => appendMsg(m.text, m.sender, m.sql));
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
