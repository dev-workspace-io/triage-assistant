<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triage SQL Assistant</title>

  <!-- Google Fonts & Prism CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">

  <style>
    :root {
      --primary-orange: #ff5500;
      --primary-hover: #e04b00;
      --cyan-glow: #00f0ff;
      --bg-color: #050811;
      --card-bg: rgba(13, 18, 30, 0.85);
      --sidebar-bg: #0b0f19;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --border-color: #1f2937;
      --bot-msg-bg: #131b2e;
      --user-msg-bg: #ff5500;
      --code-bg: #070b14;
    }

    [data-theme="light"] {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --sidebar-bg: #f8fafc;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --bot-msg-bg: #fff5f0;
      --user-msg-bg: #ff5500;
      --code-bg: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: background-color 0.2s, color 0.2s; }
    body { background-color: var(--bg-color); color: var(--text-primary); height: 100vh; display: flex; overflow: hidden; }

    /* ---------------------------------------------------- */
    /* ROTATING HEXAGON SQL CORE BACKGROUND ANIMATION       */
    /* ---------------------------------------------------- */
    .login-bg-graphics {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    .cyber-grid {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(rgba(255, 85, 0, 0.12) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    .hexagon-orbit-wrapper {
      position: relative;
      width: 750px; height: 750px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.45;
    }

    /* CENTER HUGE HEXAGON CORE */
    .center-hex-core {
      position: absolute;
      width: 220px; height: 220px;
      filter: drop-shadow(0 0 15px rgba(255, 85, 0, 0.6));
    }

    /* ROTATING ORBIT CONTAINER FOR 6 HEXAGONS */
    .hex-orbit-ring {
      position: absolute;
      width: 580px; height: 580px;
      border-radius: 50%;
      border: 1px dashed rgba(0, 240, 255, 0.25);
      animation: rotateOrbit 30s linear infinite;
    }

    .hex-node-wrapper {
      position: absolute;
      top: 50%; left: 50%;
      width: 100px; height: 100px;
      margin-top: -50px; margin-left: -50px;
    }

    /* Counter Rotation so Icons stay straight while revolving */
    .hex-node-wrapper svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.4));
      animation: counterRotate 30s linear infinite;
    }

    /* Positioning 6 Hexagons in Circle (60 Deg steps) */
    .node-1 { transform: rotate(0deg) translate(270px) rotate(0deg); }
    .node-2 { transform: rotate(60deg) translate(270px) rotate(-60deg); }
    .node-3 { transform: rotate(120deg) translate(270px) rotate(-120deg); }
    .node-4 { transform: rotate(180deg) translate(270px) rotate(-180deg); }
    .node-5 { transform: rotate(240deg) translate(270px) rotate(-240deg); }
    .node-6 { transform: rotate(300deg) translate(270px) rotate(-300deg); }

    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes counterRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    /* ---------------------------------------------------- */
    /* UI ELEMENTS & LOGIN BOX                              */
    /* ---------------------------------------------------- */
    #loginOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(5, 8, 17, 0.85); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .login-box {
      background: var(--card-bg); padding: 40px 36px; border-radius: 20px;
      border: 1.5px solid rgba(255, 85, 0, 0.5); width: 100%; max-width: 380px; text-align: center;
      box-shadow: 0 0 40px rgba(255, 85, 0, 0.25); position: relative; z-index: 10;
    }
    .login-box h2 { margin-bottom: 22px; font-size: 20px; color: #ffffff; font-weight: 700; letter-spacing: 0.5px; }
    .login-box input {
      width: 100%; padding: 13px; margin-bottom: 14px; border-radius: 10px; border: 1px solid var(--border-color);
      background: rgba(7, 11, 20, 0.9); color: var(--text-primary); outline: none; font-size: 14px;
    }
    .login-box input:focus { border-color: var(--primary-orange); box-shadow: 0 0 10px rgba(255, 85, 0, 0.4); }
    .login-box button {
      width: 100%; padding: 13px; background: var(--primary-orange); color: white; border: none;
      border-radius: 10px; font-weight: 600; cursor: pointer; margin-top: 8px; font-size: 15px;
      box-shadow: 0 4px 18px rgba(255, 85, 0, 0.45);
    }
    .login-box button:hover { background: var(--primary-hover); }
    .login-error { font-size: 13px; color: #ef4444; margin-top: 10px; display: none; }

    /* LOADER & OVERLAYS */
    .loader-ring {
      width: 50px; height: 50px; border: 4px solid rgba(255, 85, 0, 0.15);
      border-top: 4px solid var(--primary-orange); border-radius: 50%;
      animation: spin 0.9s linear infinite; margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #welcomeOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-color);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #welcomeOverlay.show { opacity: 1; visibility: visible; }
    .welcome-card h1 { font-size: 28px; color: var(--text-primary); margin-top: 10px; }
    .welcome-card p { color: var(--primary-orange); font-size: 14px; margin-top: 6px; }

    #appContainer { display: flex; width: 100%; height: 100vh; visibility: hidden; }
    .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
    .new-chat-btn { width: 100%; padding: 10px; background: var(--primary-orange); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .history-item { padding: 10px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; font-size: 13px; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center; }
    .history-item:hover, .history-item.active { background: var(--card-bg); border-color: var(--border-color); color: var(--text-primary); }
    .history-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .delete-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 14px; cursor: pointer; display: none; }
    .history-item:hover .delete-btn { display: block; }

    .sidebar-footer { border-top: 1px solid var(--border-color); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .user-row { display: flex; justify-content: space-between; align-items: center; }
    .logout-btn { background: none; border: none; color: var(--primary-orange); cursor: pointer; font-size: 13px; font-weight: 600; text-align: left; }

    .main-chat { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); }
    .top-bar { height: 60px; padding: 0 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--sidebar-bg); }
    .theme-toggle { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }

    .messages-container { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
    .msg.user { align-self: flex-end; background: var(--user-msg-bg); color: white; border-bottom-right-radius: 2px; }
    .msg.bot { align-self: flex-start; background: var(--bot-msg-bg); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }
    .msg-author { font-weight: 700; margin-bottom: 6px; font-size: 12px; opacity: 0.8; }

    .sql-box { margin-top: 12px; background: var(--code-bg); border-radius: 8px; border: 1px solid var(--border-color); overflow: hidden; }
    .sql-header { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 6px 12px; font-size: 11px; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); }
    .copy-btn { background: var(--primary-orange); color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }

    .input-area { padding: 16px 24px; border-top: 1px solid var(--border-color); background: var(--sidebar-bg); }
    .input-box { display: flex; gap: 12px; }
    .input-box textarea { flex: 1; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); padding: 12px; font-size: 14px; resize: none; height: 48px; outline: none; }
    .send-btn { background: var(--primary-orange); color: white; border: none; padding: 0 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .footer-note { font-size: 11px; color: var(--text-secondary); text-align: center; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- LOGIN OVERLAY WITH ROTATING HEXAGON SQL CORE BACKGROUND -->
  <div id="loginOverlay">
    
    <div class="login-bg-graphics">
      <div class="cyber-grid"></div>

      <div class="hexagon-orbit-wrapper">
        
        <!-- CENTER SQL BIG HEXAGON -->
        <svg class="center-hex-core" viewBox="0 0 200 200">
          <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" fill="none" stroke="#ff5500" stroke-width="5" />
          <polygon points="100,20 170,60 170,140 100,180 30,140 30,60" fill="rgba(255, 85, 0, 0.08)" stroke="#00f0ff" stroke-width="2" stroke-dasharray="12 6" />
          <text x="100" y="112" fill="#ffffff" font-size="34" font-family="'Fira Code', monospace" font-weight="700" text-anchor="middle">SQL</text>
        </svg>

        <!-- ROTATING ORBIT RING WITH 6 HEXAGON NODES -->
        <div class="hex-orbit-ring">
          
          <!-- 1. Cloud Database Hexagon -->
          <div class="hex-node-wrapper node-1">
            <svg viewBox="0 0 100 100">
              <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#0b0f19" stroke="#00f0ff" stroke-width="3"/>
              <!-- Cloud & DB Icon -->
              <path d="M35 50 A10 10 0 0 1 55 42 A12 12 0 0 1 72 50 A8 8 0 0 1 68 64 L36 64 A8 8 0 0 1 35 50 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
              <ellipse cx="50" cy="36" rx="14" ry="4" fill="none" stroke="#ff5500" stroke-width="2"/>
              <path d="M36 36 v10 c0 2.2 6.2 4 14 4 s14 -1.8 14 -4 v-10" fill="none" stroke="#ff5500" stroke-width="2"/>
            </svg>
          </div>

          <!-- 2. Search / Query Hexagon -->
          <div class="hex-node-wrapper node-2">
            <svg viewBox="0 0 100 100">
              <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#0b0f19" stroke="#00f0ff" stroke-width="3"/>
              <!-- Magnifying Glass Icon -->
              <circle cx="45" cy="45" r="14" fill="none" stroke="#ffffff" stroke-width="3"/>
              <line x1="55" y1="55" x2="70" y2="70" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>

          <!-- 3. Filter Funnel Hexagon -->
          <div class="hex-node-wrapper node-3">
            <svg viewBox="0 0 100 100">
              <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#0b0f19" stroke="#00f0ff" stroke-width="3"/>
              <!-- Funnel / Gear Icon -->
              <path d="M30 32 L70 32 L55 52 L55 70 L45 74 L45 52 Z" fill="none" stroke="#ff5500" stroke-width="2.5"/>
              <text x="50" y="28" fill="#00f0ff" font-size="8" font-family="monospace" text-anchor="middle">110100</text>
            </svg>
          </div>

          <!-- 4. Gear & Code Hexagon -->
          <div class="hex-node-wrapper node-4">
            <svg viewBox="0 0 100 100">
              <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#0b0f19" stroke="#00f0ff" stroke-width="3"/>
              <!-- Code Brackets & Gears -->
              <path d="M36 45 L28 50 L36 55 M64 45 L72 50 L64 55 M53 42 L47 58" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              <circle cx="50" cy="70" r="6" fill="none" stroke="#ff5500" stroke-width="2"/>
            </svg>
          </div>

          <!-- 5. Media Window Hexagon -->
          <div class="hex-node-wrapper node-5">
            <svg viewBox="0 0 100 100">
              <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#0b0f19" stroke="#00f0ff" stroke-width="3"/>
              <!-- Window / Video Play Icon -->
              <rect x="28" y="32" width="44" height="34" rx="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
              <polygon points="45,43 58,49 45,55" fill="#ff5500"/>
            </svg>
          </div>

          <!-- 6. Laptop & Document Hexagon -->
          <div class="hex-node-wrapper node-6">
            <svg viewBox="0 0 100 100">
              <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#0b0f19" stroke="#00f0ff" stroke-width="3"/>
              <!-- Laptop & Doc Icon -->
              <rect x="30" y="32" width="40" height="26" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
              <path d="M24 62 L76 62 L72 58 L28 58 Z" fill="#ff5500"/>
              <line x1="38" y1="40" x2="62" y2="40" stroke="#00f0ff" stroke-width="2"/>
              <line x1="38" y1="46" x2="56" y2="46" stroke="#00f0ff" stroke-width="2"/>
            </svg>
          </div>

        </div>
      </div>

    </div>

    <!-- LOGIN FORM BOX -->
    <div class="login-box">
      <h2>Triage SQL Workspace</h2>
      <input type="email" id="loginEmail" placeholder="email@oxiliry.com">
      <input type="password" id="loginPass" placeholder="Password">
      <button id="loginBtn" onclick="attemptLogin()">Login</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <!-- WELCOME SCREEN OVERLAY -->
  <div id="welcomeOverlay">
    <div class="welcome-card">
      <div class="loader-ring"></div>
      <h1 id="welcomeText">Welcome!</h1>
      <p>Initializing SQL Assistant Workspace...</p>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="appContainer">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div>
        <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
        <div class="history-list" id="historyList"></div>
      </div>

      <div class="sidebar-footer">
        <div class="user-row">
          <span class="user-info" id="userNameDisplay">User</span>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- CHAT WORKSPACE -->
    <div class="main-chat">
      <div class="top-bar">
        <div>
          <h3>Triage SQL Assistant</h3>
          <p>Smart Query Workspace</p>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark / ☀️ Light</button>
      </div>

      <div class="messages-container" id="messagesContainer"></div>

      <div class="input-area">
        <div class="input-box">
          <textarea id="userInput" placeholder="Write here something..." onkeydown="handleKeyPress(event)"></textarea>
          <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
        <p class="footer-note">Powered by <b>ReBiz @Triage AI</b> | 💡 <i>Triage AI can make mistakes. Double-check important info & conditions before executing.</i></p>
      </div>
    </div>
  </div>

  <!-- PrismJS for Syntax Highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzSufITdeq53VYP2u4cH5FLMBZHxPOa5YvWUoZEzHSS5A1N1WXi6m_IzkipVcWCZLjQ/exec";

    let currentUser = null;
    let chats = [];
    let currentChatId = null;

    async function apiCall(payload, retries = 2) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        return await response.json();
      } catch (err) {
        clearTimeout(timeoutId);
        if (retries > 0) {
          await new Promise(r => setTimeout(r, 1000));
          return await apiCall(payload, retries - 1);
        }
        throw err;
      }
    }

    async function attemptLogin() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPass").value;
      const errorDiv = document.getElementById("loginError");
      const btn = document.getElementById("loginBtn");

      errorDiv.style.display = "none";
      if (!email || !password) {
        errorDiv.innerText = "Please fill in all fields.";
        errorDiv.style.display = "block";
        return;
      }

      btn.innerText = "Logging in...";
      btn.disabled = true;

      try {
        const res = await apiCall({ action: "login", email: email, password: password });

        if (res.status === "success") {
          currentUser = res.user;

          document.getElementById("loginOverlay").style.display = "none";

          const welcomeOverlay = document.getElementById("welcomeOverlay");
          document.getElementById("welcomeText").innerText = "Welcome, " + currentUser.name + "!";
          welcomeOverlay.classList.add("show");

          setTimeout(() => {
            welcomeOverlay.classList.remove("show");
            document.getElementById("appContainer").style.visibility = "visible";
            document.getElementById("userNameDisplay").innerText = currentUser.name;
            loadChatHistory();
          }, 2000);

        } else {
          errorDiv.innerText = res.message || "Invalid login credentials.";
          errorDiv.style.display = "block";
        }
      } catch (err) {
        errorDiv.innerText = "Connection error. Please check your network.";
        errorDiv.style.display = "block";
      } finally {
        btn.innerText = "Login";
        btn.disabled = false;
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById("appContainer").style.visibility = "hidden";
      document.getElementById("loginOverlay").style.display = "flex";
      document.getElementById("loginEmail").value = "";
      document.getElementById("loginPass").value = "";
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      const newTheme = currentTheme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", newTheme);
    }

    async function loadChatHistory() {
      try {
        const res = await apiCall({ action: "getHistory", email: currentUser.email });
        chats = res.history || [];

        renderHistoryList();
        if (chats.length > 0) {
          selectChat(chats[0].chatId);
        } else {
          startNewChat();
        }
      } catch (e) {
        startNewChat();
      }
    }

    function renderHistoryList() {
      const list = document.getElementById("historyList");
      list.innerHTML = "";
      chats.forEach(c => {
        const item = document.createElement("div");
        item.className = `history-item ${c.chatId === currentChatId ? 'active' : ''}`;
        
        item.innerHTML = `
          <span class="history-title" onclick="selectChat('${c.chatId}')">${c.title || 'New Chat'}</span>
          <button class="delete-btn" onclick="deleteChat(event, '${c.chatId}')" title="Delete Chat">🗑️</button>
        `;
        list.appendChild(item);
      });
    }

    function selectChat(id) {
      currentChatId = id;
      renderHistoryList();
      const chat = chats.find(c => c.chatId === id);
      const container = document.getElementById("messagesContainer");
      container.innerHTML = "";

      if (chat && chat.messages) {
        chat.messages.forEach(m => renderMessageUI(m.role, m.text, m.sql));
      }
    }

    function startNewChat() {
      currentChatId = "chat_" + Date.now();
      const newChat = { chatId: currentChatId, title: "New Chat", messages: [] };
      chats.unshift(newChat);
      selectChat(currentChatId);
    }

    async function deleteChat(event, chatId) {
      event.stopPropagation();
      if (!confirm("Are you sure you want to delete this chat?")) return;

      chats = chats.filter(c => c.chatId !== chatId);

      if (chats.length > 0) {
        selectChat(chats[0].chatId);
      } else {
        startNewChat();
      }

      try {
        await apiCall({ action: "deleteChat", email: currentUser.email, chatId: chatId });
      } catch(e) {}
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const sendBtn = document.querySelector(".send-btn");
      const msgText = input.value.trim();
      if (!msgText) return;

      input.value = "";
      sendBtn.disabled = true;

      renderMessageUI("user", msgText);
      saveToLocalHistory("user", msgText);

      const container = document.getElementById("messagesContainer");
      const loadingDiv = document.createElement("div");
      loadingDiv.className = "msg bot temp-loading";
      loadingDiv.innerText = "Thinking...";
      container.appendChild(loadingDiv);
      container.scrollTop = container.scrollHeight;

      try {
        const res = await apiCall({
          action: "processMessage",
          message: msgText,
          userName: currentUser ? currentUser.name : "User"
        });

        document.querySelectorAll(".temp-loading").forEach(el => el.remove());

        if (res && res.text) {
          renderMessageUI("bot", res.text, res.sql);
          saveToLocalHistory("bot", res.text, res.sql);

          const currentChat = chats.find(c => c.chatId === currentChatId);
          if (currentChat && currentChat.title === "New Chat") {
            currentChat.title = msgText.substring(0, 20) + "...";
            renderHistoryList();
          }
          saveChatToBackend(currentChat);
        } else {
          renderMessageUI("bot", "No response received from server.");
        }

      } catch (err) {
        document.querySelectorAll(".temp-loading").forEach(el => el.remove());
        renderMessageUI("bot", "Connection error. Please try again.");
      } finally {
        sendBtn.disabled = false;
      }
    }

    function saveToLocalHistory(role, text, sql = null) {
      let chat = chats.find(c => c.chatId === currentChatId);
      if (!chat) {
        chat = { chatId: currentChatId, title: text.substring(0, 20) + "...", messages: [] };
        chats.unshift(chat);
      }
      chat.messages.push({ role, text, sql });
    }

    async function saveChatToBackend(chat) {
      if (!chat) return;
      try {
        await apiCall({
          action: "saveChat",
          email: currentUser.email,
          chatId: chat.chatId,
          title: chat.title,
          messages: chat.messages
        });
      } catch(e) {}
    }

    function renderMessageUI(role, text, sql) {
      const container = document.getElementById("messagesContainer");
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${role}`;

      let html = `<div class="msg-author">${role === 'user' ? 'You:' : 'Assistant:'}</div>`;
      html += `<div>${text.replace(/\n/g, '<br>')}</div>`;

      if (sql) {
        html += `
          <div class="sql-box">
            <div class="sql-header">
              <span>SQL QUERY</span>
              <button class="copy-btn" onclick="copySql(this)">Copy</button>
            </div>
            <pre><code class="language-sql">${escapeHtml(sql)}</code></pre>
          </div>
        `;
      }

      msgDiv.innerHTML = html;
      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
      Prism.highlightAll();
    }

    function copySql(btn) {
      const code = btn.closest('.sql-box').querySelector('code').innerText;
      navigator.clipboard.writeText(code);
      btn.innerText = "Copied!";
      setTimeout(() => btn.innerText = "Copy", 2000);
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }
  </script>
</body>
</html>
